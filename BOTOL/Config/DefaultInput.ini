[/Script/Engine.InputSettings]
; Dans l'editeur, la souris imite un doigt : on teste les controles tactiles sans telephone.
; (Le pincement a deux doigts se teste sur le telephone ; sur PC, la molette zoome.)
bUseMouseForTouch=True
; Pas de joysticks virtuels : BOTOL se joue au toucher direct sur la carte.
bAlwaysShowTouchInterface=False
DefaultTouchInterface=None
DefaultPlayerInputClass=/Script/EnhancedInput.EnhancedPlayerInput
DefaultInputComponentClass=/Script/EnhancedInput.EnhancedInputComponent
