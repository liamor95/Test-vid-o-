; BOTOL - reglages moteur orientes mobile.
; Principe : rien de ce qui est reserve au PC haut de gamme (Lumen, Nanite, ray tracing,
; ombres virtuelles, distance fields). Les performances se mesurent sur le telephone de reference.

[/Script/EngineSettings.GameMapsSettings]
GlobalDefaultGameMode=/Script/BOTOL.BotolGameMode
; EditorStartupMap et GameDefaultMap : a renseigner apres avoir cree le niveau de test (voir README, session 1).

[/Script/HardwareTargeting.HardwareTargetingSettings]
TargetedHardwareClass=Mobile
AppliedTargetedHardwareClass=Mobile
DefaultGraphicsPerformance=Scalable
AppliedDefaultGraphicsPerformance=Scalable

[/Script/Engine.RendererSettings]
; --- Rendu mobile ---
; 0 = forward (le plus econome sur mobile, compatible MSAA), 1 = deferred.
r.Mobile.ShadingPath=0
; Anticrenelage mobile : 3 = MSAA, peu couteux sur les GPU de telephone. 4 echantillons.
r.Mobile.AntiAliasing=3
r.MSAACount=4
; HDR mobile garde le tonemapping et le post-process (ambiance sous-marine). A couper si le telephone de reference ne suit pas.
r.MobileHDR=True
; Eclairage precalcule autorise : la solution la moins chere sur mobile.
r.AllowStaticLighting=True

; --- Fonctions PC desactivees ---
r.Nanite.ProjectEnabled=False
r.DynamicGlobalIlluminationMethod=0
r.ReflectionMethod=0
r.Shadow.Virtual.Enable=0
r.GenerateMeshDistanceFields=False
r.RayTracing=False
r.VirtualTextures=False
r.Substrate=False

; --- Effets par defaut desactives (cout GPU, peu utiles en vue isometrique) ---
r.DefaultFeature.AutoExposure=False
r.DefaultFeature.MotionBlur=False
r.DefaultFeature.AmbientOcclusion=False
r.DefaultFeature.LensFlare=False

; Ne cuisiner que les niveaux de qualite de materiaux utilises (paquet plus leger).
r.DiscardUnusedQuality=True

[/Script/AndroidRuntimeSettings.AndroidRuntimeSettings]
; Identifiant PROVISOIRE : il deviendra definitif a la premiere publication sur Google Play.
; A confirmer une fois le proprietaire de BOTOL decide (3DECORS, Liamor ou future societe).
PackageName=com.troisdecors.botol
StoreVersion=1
VersionDisplayName=0.1.0
; Paysage, avec rotation automatique entre les deux sens.
Orientation=SensorLandscape
; Plein ecran immersif (barres systeme masquees).
bFullScreen=True
; Vulkan en priorite, OpenGL ES 3.1 en secours pour les appareils plus anciens.
bSupportsVulkan=True
bBuildForES31=True
bBuildForArm64=True

[/Script/IOSRuntimeSettings.IOSRuntimeSettings]
BundleDisplayName=BOTOL
BundleName=botol
; Identifiant PROVISOIRE, meme remarque que pour Android.
BundleIdentifier=com.troisdecors.botol
bSupportsPortraitOrientation=False
bSupportsUpsideDownOrientation=False
bSupportsLandscapeLeftOrientation=True
bSupportsLandscapeRightOrientation=True
